# pipeline de CI: a cada push/PR na main, roda os testes e valida o Terraform.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # testes da API (em duas versões do Node)
  testes:
    name: Testes da aplicação
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

  # valida os scripts de infra
  infra:
    name: Validar Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Checar formatação
        run: terraform fmt -check -recursive
        working-directory: ./infra

      - name: Inicializar
        run: terraform init -backend=false
        working-directory: ./infra

      - name: Validar
        run: terraform validate
        working-directory: ./infra
